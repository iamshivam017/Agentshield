name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies and audit tool
        run: python -m pip install -r ml/requirements.txt pytest pip-audit==2.9.0
      - name: Test ML contracts
        run: PYTHONPATH=ml/src pytest -q ml/tests
      - name: Compile ML package
        run: PYTHONPATH=ml/src python -m compileall -q ml/src
      - name: Runtime training smoke
        run: |
          rm -rf /tmp/agentshield-model
          PYTHONPATH=ml/src python -m agentshield_ml.train --rows 5000 --seed 42 --output-dir /tmp/agentshield-model
          PYTHONPATH=ml/src python scripts/verify_model_artifact.py /tmp/agentshield-model
      - name: Upload verified model smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-risk-model-smoke-${{ github.sha }}
          path: |
            /tmp/agentshield-model/model.joblib
            /tmp/agentshield-model/metadata.json
          if-no-files-found: error
      - name: Dependency audit
        run: python -m pip_audit -r ml/requirements.txt

  api:
    runs-on: ubuntu-latest
    needs: [ml]
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield
          POSTGRES_DB: agentshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentshield -d agentshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Download verified model smoke artifact
        uses: actions/download-artifact@v5
        with:
          name: agentshield-risk-model-smoke-${{ github.sha }}
          path: /tmp/agentshield-model
      - name: Install ML artifact verifier dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Verify downloaded model artifact
        run: PYTHONPATH=ml/src python scripts/verify_model_artifact.py /tmp/agentshield-model
      - name: Read model metadata
        id: model
        run: |
          echo "sha256=$(python -c 'import json; print(json.load(open("/tmp/agentshield-model/metadata.json"))["artifact_sha256"])')" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import json; print(json.load(open("/tmp/agentshield-model/metadata.json"))["model_version"])')" >> "$GITHUB_OUTPUT"
      - name: Lint API
        run: PYTHONPATH=apps/api/src:apps/api python -m ruff check apps/api
      - name: Type-check API
        run: PYTHONPATH=apps/api/src:apps/api python -m mypy apps/api/app apps/api/src
      - name: Validate live database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://agentshield:agentshield@localhost:5432/agentshield
        run: PYTHONPATH=src alembic upgrade head
      - name: Backup and restore drill
        env:
          SOURCE_DATABASE_URL: postgresql+psycopg://agentshield:agentshield@localhost:5432/agentshield
          RESTORE_DATABASE_URL: postgresql+psycopg://agentshield:agentshield@localhost:5432/agentshield_restore
          ALLOW_DESTRUCTIVE_RESTORE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=agentshield createdb -h localhost -U agentshield agentshield_restore
          bash scripts/backup_restore_smoke.sh
      - name: Test API
        env:
          DATABASE_URL: postgresql+psycopg://agentshield:agentshield@localhost:5432/agentshield
          REDIS_URL: redis://localhost:6379/0
          RISK_MODEL_ARTIFACT_PATH: /tmp/agentshield-model/model.joblib
          RISK_MODEL_METADATA_PATH: /tmp/agentshield-model/metadata.json
          RISK_MODEL_ARTIFACT_SHA256: ${{ steps.model.outputs.sha256 }}
          RISK_MODEL_VERSION: ${{ steps.model.outputs.version }}
        run: PYTHONPATH=apps/api/src:apps/api pytest -q apps/api/tests
      - name: Dependency audit
        run: PYTHONPATH=apps/api/src:apps/api python -m pip_audit -r apps/api/requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install web dependencies
        run: npm install
      - name: Lint web
        run: npm run lint
      - name: Type-check web
        run: npm run typecheck
      - name: Build web
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Run accessibility audit
        run: npm run test:a11y
      - name: Dependency audit
        run: npm audit --audit-level=high

  performance-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate k6 script syntax
        run: node --check perf/k6/risk-evaluate.js
      - name: Validate supported performance profiles
        run: |
          grep -q "K6_PROFILE || 'load'" perf/k6/risk-evaluate.js
          for profile in smoke load stress soak; do
            grep -q "^  ${profile}:" perf/k6/risk-evaluate.js
            grep -q "${profile}: {" perf/k6/risk-evaluate.js
          done

  container:
    runs-on: ubuntu-latest
    needs: [api, ml, web, performance-script]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t agentshield-api:ci .
      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t agentshield-web:ci .

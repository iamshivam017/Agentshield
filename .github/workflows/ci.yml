name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Lint API
        run: PYTHONPATH=apps/api/src:apps/api python -m ruff check apps/api
      - name: Type-check API
        run: PYTHONPATH=apps/api/src:apps/api python -m mypy apps/api/app apps/api/src
      - name: Test API
        run: PYTHONPATH=apps/api/src:apps/api pytest -q
      - name: Dependency audit
        run: PYTHONPATH=apps/api/src:apps/api python -m pip_audit -r apps/api/requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Type-check web
        run: npm run typecheck
      - name: Build web
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t agentshield-api:ci .
      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t agentshield-web:ci .
